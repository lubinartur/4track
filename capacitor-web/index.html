<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>4track</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #161620;
        color: rgba(255, 255, 255, 0.8);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial,
          sans-serif;
      }
      .wrap {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 320px;
        background: rgba(16, 16, 24, 0.9);
        border: 1px solid rgba(255, 91, 0, 0.35);
        border-radius: 16px;
        padding: 18px 16px;
      }
      .title {
        font-size: 14px;
        color: #fff;
        margin: 0 0 8px;
      }
      .body {
        font-size: 12px;
        line-height: 1.35;
        margin: 0;
      }
      code {
        color: #ff5b00;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <p class="title">4track iOS shell</p>
        <p class="body">
          This build is configured for a <strong>hosted</strong> Next.js app. Set
          <code>CAPACITOR_SERVER_URL</code> and rebuild the iOS project.
        </p>
      </div>
    </div>
  </body>
</html>
